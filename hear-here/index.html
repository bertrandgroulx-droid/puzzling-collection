<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hear, Here</title>
<meta name="description" content="Two clues, two words that sound the same but are spelled differently.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="../shared/style.css">
</head>
<body>
<main class="app">
  <a class="home" href="../">&larr; All games</a>
  <header>
    <h1>Hear, Here</h1>
    <div class="score" aria-live="polite">Score <b id="score">0</b> / <span id="max">10</span></div>
  </header>
  <section id="stage" class="stack"></section>
</main>

<script src="puzzles.js"></script>
<script src="../shared/game.js"></script>
<script>
// The settings for this game. Puzzles live in puzzles.js.
startGame({
  type: "typed",      // typed answers, both must be right together
  per: 5,             // puzzles per game
  max: 2,             // points per puzzle
  rules: "2 points, or 1 after a hint.",
  puzzles: window.HEAR_HERE_PUZZLES
});
</script>
</body>
</html>
