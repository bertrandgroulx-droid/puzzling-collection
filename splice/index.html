<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Splice</title>
<meta name="description" content="Two clues, two words, blended into one where they overlap.">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121214" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="icons/favicon-16.png" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Splice">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Public+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="../shared/style.css?v=20261010-211722">
</head>
<body>
<main class="app">
  <header class="top">
    <div class="name"><h1>Splice</h1></div>
    <button class="howto" id="helpBtn" type="button"><span class="qmark" aria-hidden="true">?</span>How to play</button>
  </header>
  <div class="daily"><span id="dailyText"></span><nav class="links" id="links" aria-label="Where to go next"></nav></div>
  <section id="shell" class="stack" hidden></section>
  <section id="stage" class="stack" data-game-ui></section>
  <dialog class="help" id="help"></dialog>
</main>

<script src="puzzles.js?v=20261010-211722"></script>
<script src="../shared/keys.js?v=20261010-211722"></script>
<script src="../shared/shell.js?v=20261010-211722"></script>
<script src="../shared/game.js?v=20261010-211722"></script>
<script>
// The settings for this game. Puzzles live in puzzles.js; the look in ../shared/style.css.
startGame({
  game: "splice",
  title: "Splice",
  type: "typed",      // one typed answer
  per: 5,             // puzzles per game
  max: 2,             // points per puzzle
  instruction: "Type the two words blended into one.",
  how: {
    goal: "Two clues give two words. Blend them into one word where their sounds overlap.",
    steps: [
      "The end of the first word is the start of the second. Join them where they overlap and type the blend, then tap Check.",
      "2 points, or 1 point after a hint.",
      "<b>Hint</b> shows the first letter and the length. <b>Give up</b> (tapped twice) shows the blend and scores nothing."
    ],
    example: "“You hit it with sticks” and “it keeps the rain off” are <b>DRUM</b> and <b>UMBRELLA</b>: <b>DRUMBRELLA</b>."
  },
  puzzles: window.SPLICE_PUZZLES
});
</script>
</body>
</html>
