<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stowaway</title>
<meta name="description" content="Two clues, two words: the second is the first with one letter smuggled in.">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121214" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Public+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="../shared/style.css">
</head>
<body>
<main class="app">
  <header class="top">
    <div class="name"><h1>Stowaway</h1></div>
    <button class="q" id="helpBtn" type="button" aria-label="How to play">?</button>
  </header>
  <div class="daily"><span id="dailyText"></span><a id="pastLink" href="?past">Past puzzles</a></div>
  <section id="shell" class="stack" hidden></section>
  <section id="stage" class="stack" data-game-ui></section>
  <dialog class="help" id="help"></dialog>
</main>

<script src="puzzles.js"></script>
<script src="../shared/keys.js"></script>
<script src="../shared/shell.js"></script>
<script src="../shared/game.js"></script>
<script>
// The settings for this game. Puzzles live in puzzles.js; the look in ../shared/style.css.
startGame({
  game: "stowaway",
  title: "Stowaway",
  type: "typed",      // typed answers, both must be right together
  per: 5,             // puzzles per game
  max: 2,             // points per puzzle
  instruction: "Find two words, the second being the first with one letter added. Type both, then tap Check.",
  how: {
    goal: "Find two words from two clues. The second word is the first word with one extra letter.",
    steps: [
      "The extra letter can go at the start, in the middle or at the end.",
      "Type both words, then tap Check. Both must be right together.",
      "2 points, or 1 point after a hint.",
      "<b>Hint</b> shows the first letter of each word. <b>Give up</b> shows both answers and scores nothing."
    ],
    example: "“A hot drink” and “a group of players” are <b>TEA</b> and <b>TEAM</b>."
  },
  puzzles: window.STOWAWAY_PUZZLES
});
</script>
</body>
</html>
