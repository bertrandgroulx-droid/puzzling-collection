<title>Snowball</title>
<link rel="canonical" href="https://shozbot.com/puzzling/snowball/">
<script>
  /* This game lives at shozbot.com/puzzling/ now. Anyone still arriving at the old GitHub
     Pages address is moved across, keeping the rest of the path, the query and the hash,
     so that scores, streaks and settings (which a browser files under whichever address
     they were made on) pile up in one place instead of quietly splitting in two.

     The hostname test is load-bearing, not defensive. shozbot.com serves this very file
     through a rewrite, so without the test the redirect would fire there too and bounce
     the browser against the same address for ever. */
  (function () {
    if (location.hostname !== "bertrandgroulx-droid.github.io") return;
    location.replace("https://shozbot.com" + location.pathname.replace(/^\/puzzling-collection(\/|$)/, "/puzzling/") + location.search + location.hash);
  })();
</script>
<meta name="description" content="Start with three letters and add one at a time to match three clues, so the word grows.">

  </header>

<script>
// The settings for this game. Puzzles live in puzzles.js; the look in ../shared/style.css.
startGame({
  game: "snowball",
  title: "Snowball",
  type: "grow",       // the word grows by one letter a step
  per: 4,             // chains per game
  max: 3,             // points per chain
  instruction: "Add one letter so the word matches the clue, then tap Check.",
  how: {
    goal: "Start with a three-letter word and add one letter at a time, so each answer matches its clue and the word grows to six letters.",
    steps: [
      "A three-letter word is shown. Each clue describes the word you get by adding one letter anywhere and keeping the rest in order.",
      "Type the longer word, then tap Check. Three clues, three words.",
      "1 point for each clue. There is no clock.",
      "<b>Hint</b> marks the gap where the new letter goes and costs 1 point. <b>Give up</b> (tapped twice) shows the rest and keeps what you have scored."
    ],
    example: "<b>MAN</b>, then “the long hair on a horse's neck” is <b>MANE</b>, “a skin disease of dogs” is <b>MANGE</b>, and “to run a shop” is <b>MANAGE</b>."
  },
  puzzles: window.SNOWBALL_PUZZLES
});
</script>
