<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tumble</title>
<link rel="canonical" href="https://shozbot.com/puzzling/tumble/">
<script>
  /* This game lives at shozbot.com/puzzling/ now. Anyone still arriving at the old GitHub
     Pages address is moved across, keeping the rest of the path, the query and the hash,
     so that scores, streaks and settings (which a browser files under whichever address
     they were made on) pile up in one place instead of quietly splitting in two.

     The hostname test is load-bearing, not defensive. shozbot.com serves this very file
     through a rewrite, so without the test the redirect would fire there too and bounce
     the browser against the same address for ever. */
  (function () {
    if (location.hostname !== "bertrandgroulx-droid.github.io") return;
    location.replace("https://shozbot.com" + location.pathname.replace(/^\/puzzling-collection(\/|$)/, "/puzzling/") + location.search + location.hash);
  })();
</script>
<meta name="description" content="An anagram game: rearrange the letters to fit the clue, then find a bonus word in the same letters.">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121214" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="icons/favicon-16.png" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Tumble">
<link rel="preconnect" href="https://fonts.googleapis.com">

<body>
<main class="app">
  <header class="top">
    <div class="name"><h1>Tumble</h1></div>
    <button class="howto" id="helpBtn" type="button"><span class="qmark" aria-hidden="true">?</span>How to play</button>
  </header>
  <div class="daily"><span id="dailyText"></span><nav class="links" id="links" aria-label="Where to go next"></nav></div>
  <section id="shell" class="stack" hidden></section>
  <section id="stage" class="stack" data-game-ui></section>
  <dialog class="help" id="help"></dialog>
</main>

<script src="puzzles.js?v=20261011-002433"></script>
<script src="../shared/keys.js?v=20261011-002433"></script>
<script src="../shared/shell.js?v=20261011-002433"></script>
<script src="../shared/game.js?v=20261011-002433"></script>
<script>
// The settings for this game. Puzzles live in puzzles.js; the look in ../shared/style.css.
startGame({
  game: "tumble",
  title: "Tumble",
  type: "typed",      // typed answers
  each: true,         // each word scores on its own
  timer: 30,          // seconds for both words
  per: 5,             // puzzles per game
  max: 2,             // points per puzzle
  timed: { title: "Five puzzles, 30 seconds each", rules: "Both words in 30 seconds. 1 point per word." },
  instruction: "Make an anagram: use every letter to fit the clue, then tap Check.",
  how: {
    goal: "An anagram game. Rearrange the letters into the word the clue describes, then find a second word in the same letters.",
    steps: [
      "The letters of a real word are shown, five or six of them. Type a word that uses every letter and matches the clue, then tap Check.",
      "Once the first word is right, a bonus clue asks for a second word made from the same letters.",
      "1 point for each word. 30 seconds for both, unless the timer is off.",
      "<b>Hint</b> shows the first letter of the word you are on and costs 1 point. <b>Give up</b> (tapped twice) ends the puzzle and keeps what you have scored."
    ],
    example: "<b>HEART</b> with the clue “the ground beneath you” is <b>EARTH</b>. The bonus clue “someone full of dislike” is <b>HATER</b>."
  },
  puzzles: window.TUMBLE_PUZZLES
});
</script>
<!-- The studio kit. data-by puts the words "by shozbot" on its own line under the game's
     name, linking to the studio; it also counts the visit. See shozbot.com/kit/kit.js. -->
<script src="https://shozbot.com/kit/kit.js"
        data-by=".top .name h1" data-by-block defer></script>
</body>
</html>
