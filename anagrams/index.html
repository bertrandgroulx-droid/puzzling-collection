<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anagrams</title>
<meta name="description" content="Unscramble a word to fit the clue, then find a bonus word in the same letters.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="../shared/style.css">
</head>
<body>
<main class="app">
  <a class="home" href="../">&larr; All games</a>
  <header>
    <h1>Anagrams</h1>
    <div class="score" aria-live="polite">Score <b id="score">0</b> / <span id="max">10</span></div>
  </header>
  <section id="stage" class="stack"></section>
</main>

<script src="puzzles.js"></script>
<script src="../shared/game.js"></script>
<script>
// The settings for this game. Puzzles live in puzzles.js.
startGame({
  type: "typed",      // typed answers
  each: true,         // each word scores on its own
  timer: 30,          // seconds for both words
  per: 5,             // puzzles per game
  max: 2,             // points per puzzle
  rules: "1 point per word, 30 seconds for both.",
  puzzles: window.ANAGRAMS_PUZZLES
});
</script>
</body>
</html>
