<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Swap One</title>
<meta name="description" content="Change one letter at a time to climb a three-step word ladder.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="../shared/style.css">
<link rel="stylesheet" href="../shared/daily.css">
</head>
<body>
<main class="app">
  <a class="home" id="backLink" href="../">&larr; All games</a>
  <header>
    <h1>Swap One</h1>
    <div class="score" aria-live="polite" data-game-ui>Score <b id="score">0</b> / <span id="max">10</span></div>
  </header>
  <p class="modeline" id="modeLine" hidden></p>
  <section id="menu" class="stack"></section>
  <section id="stage" class="stack" data-game-ui></section>
</main>

<script src="puzzles.js"></script>
<script src="../shared/keys.js"></script>
<script src="../shared/daily.js"></script>
<script src="../shared/game.js"></script>
<script>
// The settings for this game. Puzzles live in puzzles.js.
startGame({
  game: "swap-one",   // the folder name; the daily schedule is keyed by it
  type: "swap",       // tap a letter, pick its replacement
  timer: 25,          // seconds per ladder
  per: 4,             // ladders per game
  max: 3,             // points per ladder
  rules: "1 point per step. A wrong swap costs 3 seconds.",
  rulesUntimed: "1 point per step. No clock.",
  puzzles: window.SWAP_ONE_PUZZLES
});
</script>
</body>
</html>
