<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Switcheroo</title>
<link rel="canonical" href="https://shozbot.com/puzzling/switcheroo/">
<script>
  /* This game lives at shozbot.com/puzzling/ now. Anyone still arriving at the old GitHub
     Pages address is moved across, keeping the rest of the path, the query and the hash,
     so that scores, streaks and settings (which a browser files under whichever address
     they were made on) pile up in one place instead of quietly splitting in two.

     The hostname test is load-bearing, not defensive. shozbot.com serves this very file
     through a rewrite, so without the test the redirect would fire there too and bounce
     the browser against the same address for ever. */
  (function () {
    if (location.hostname !== "bertrandgroulx-droid.github.io") return;
    location.replace("https://shozbot.com" + location.pathname.replace(/^\/puzzling-collection(\/|$)/, "/puzzling/") + location.search + location.hash);
  })();
</script>
<meta name="description" content="Change one letter at a time to climb a three-step word ladder.">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121214" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="icons/favicon-16.png" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Switcheroo">

<body>
<main class="app">
  <header class="top">
    <div class="name"><h1>Switcheroo</h1></div>
    <button class="howto" id="helpBtn" type="button"><span class="qmark" aria-hidden="true">?</span>How to play</button>
  </header>
  <div class="daily"><span id="dailyText"></span><nav class="links" id="links" aria-label="Where to go next"></nav></div>
  <section id="shell" class="stack" hidden></section>
  <section id="stage" class="stack" data-game-ui></section>
  <dialog class="help" id="help"></dialog>
</main>

<script src="puzzles.js?v=20261010-220710"></script>
<script src="../shared/keys.js?v=20261010-220710"></script>
<script src="../shared/shell.js?v=20261010-220710"></script>
<script src="../shared/game.js?v=20261010-220710"></script>
<script>
// The settings for this game. Puzzles live in puzzles.js; the look in ../shared/style.css.
startGame({
  game: "switcheroo",
  title: "Switcheroo",
  type: "swap",       // tap a letter, pick its replacement
  timer: 25,          // seconds per ladder
  per: 4,             // ladders per game
  max: 3,             // points per ladder
  timed: { title: "Four ladders, 25 seconds each", rules: "Three steps per ladder. 1 point per step; a wrong swap costs 3 seconds." },
  instruction: "Tap a letter, then its replacement.",
  how: {
    goal: "Climb a word ladder: change one letter at a time so the word matches each clue.",
    steps: [
      "Start with a four-letter word. Each clue describes a new word that differs from the last one by exactly one letter, in any position.",
      "Tap the letter to change, then tap its replacement on the keyboard.",
      "1 point for each of the three steps. 25 seconds per ladder, and a wrong swap costs 3 seconds, unless the timer is off.",
      "<b>Hint</b> marks the letter to change and costs 1 point. <b>Give up</b> (tapped twice) shows the rest of the ladder and keeps what you have scored."
    ],
    example: "<b>COLD</b>, then “a length of string” is <b>CORD</b>, “it comes in a deck” is <b>CARD</b>, and “not soft” is <b>HARD</b>."
  },
  puzzles: window.SWITCHEROO_PUZZLES
});
</script>
<!-- The studio kit. data-by puts the words "by shozbot" on its own line under the game's
     name, linking to the studio; it also counts the visit. See shozbot.com/kit/kit.js. -->
<script src="https://shozbot.com/kit/kit.js"
        data-by=".top .name h1" data-by-block defer></script>
</body>
</html>
